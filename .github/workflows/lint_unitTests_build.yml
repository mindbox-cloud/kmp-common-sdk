name: Lint + UnitTests + Build

on:
  push:
    branches:
      - develop
      - mission/*
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Common SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Get changed Kotlin files
        id: get_changed_files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
            set -euo pipefail
            if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "Base commit '$BASE_SHA' unavailable; falling back to ${HEAD_SHA}^"
              BASE_SHA=$(git rev-parse "${HEAD_SHA}^")
            fi
            echo "Diff range: $BASE_SHA..$HEAD_SHA"
            CHANGED_FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" | { grep -E '\.kt$|\.kts$' || true; })
            echo "Changed Kotlin files:"
            echo "$CHANGED_FILES"
            DELIM="EOF_$(openssl rand -hex 8)"
            {
              echo "CHANGED_FILES<<$DELIM"
              echo "$CHANGED_FILES"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"

      - name: Run ktlintCheck on changed files
        if: steps.get_changed_files.outputs.CHANGED_FILES != ''
        env:
          CHANGED_FILES: ${{ steps.get_changed_files.outputs.CHANGED_FILES }}
        run: ./gradlew ktlintCheck -PinternalKtlintGitFilter="$CHANGED_FILES"

      - name: lint check
        run: ./gradlew --no-daemon lint

      - name: unit tests
        run: ./gradlew --no-daemon --stacktrace --rerun-tasks test

      - name: build project
        run: ./gradlew --no-daemon assemble
