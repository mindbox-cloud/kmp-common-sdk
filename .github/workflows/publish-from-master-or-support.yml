name: 2. Auto Github Release

on:
  pull_request:
    types: [closed]
    branches:
      - 'master'
      - 'support/*'

permissions:
  contents: read

jobs:
  call-reusable:
    if: ${{ github.event.pull_request.merged == true }}
    permissions:
      contents: write
    uses: ./.github/workflows/publish-reusable.yml
    with:
      branch: ${{ github.base_ref }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      MOBILE_CI_APP_PRIVATE_KEY: ${{ secrets.MOBILE_CI_APP_PRIVATE_KEY }}